[package]
name = "chunky_pumpkin"
version = "1.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the server commit: Pumpkin development builds can share a version banner
# while exporting different WIT event types.
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "8adc29feb5e30a29934ef1deb8030d5d822c9b7e", package = "pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[profile.release]
lto = true
opt-level = 3
