[package]
name = "chunky_pumpkin"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "204a94ed895f041a845630d5a23c094705a0704e", package = "pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[profile.release]
lto = true
opt-level = 3
